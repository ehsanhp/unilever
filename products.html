<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="لیست محصولات دیلم یونیلیور - عطر، شامپو، مام و ...">
  <meta name="theme-color" content="#c9a227">
  <title>محصولات | دیلم یونیلیور</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header" id="header"></header>

  <section class="section">
    <div class="container">
      <h1 class="section-title">محصولات</h1>
      <p class="section-subtitle">جستجو و فیلتر کنید تا محصول مورد نظرتان را پیدا کنید</p>

      <div class="toolbar">
        <div class="search-box">
          <span class="icon">🔍</span>
          <input type="search" id="searchInput" placeholder="جستجوی نام محصول...">
        </div>
        <div class="filter-pills" id="filterPills"></div>
      </div>

      <div class="products-grid" id="productsGrid"></div>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>

  <!-- مودال استعلام قیمت -->
  <div class="modal-overlay" id="inquiryModal">
    <div class="modal">
      <h3>استعلام قیمت</h3>
      <p>محصول: <strong id="inquiryProductName"></strong></p>
      <form id="inquiryForm">
        <input type="hidden" id="inquiryProductId">
        <div class="form-group">
          <label for="customerName">نام شما</label>
          <input type="text" id="customerName" placeholder="نام و نام خانوادگی" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeInquiryModal()">انصراف</button>
          <button type="submit" class="btn btn-primary">ارسال به واتساپ</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
